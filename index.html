<html lang="vi">
<head>
<meta charset="UTF-8">

<title>Hướng dẫn cài đặt công tơ</title>
<style>
  :root {
    --bg: #f5f7fa;
    --card: #ffffff;
    --primary: #0066cc;
    --text: #1a1a1a;
    --muted: #666;
    --shadow: 0 4px 16px rgba(0,0,0,0.08);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    padding-bottom: 40px;
  }
  header {
    background: linear-gradient(135deg, #0066cc, #004a99);
    color: white;
    padding: 20px 16px 16px;
    position: sticky;
    top: 0;
    z-index: 100;
    box-shadow: 0 2px 12px rgba(0,0,0,0.15);
  }
  header h1 {
    font-size: 20px;
    font-weight: 700;
    margin-bottom: 4px;
  }
  header p {
    font-size: 13px;
    opacity: 0.9;
  }
  .search-box {
    margin-top: 12px;
    position: relative;
  }
  .search-box input {
    width: 100%;
    padding: 12px 16px 12px 42px;
    border: none;
    border-radius: 12px;
    font-size: 15px;
    background: rgba(255,255,255,0.95);
    outline: none;
  }
  .search-box::before {
    content: "🔍";
    position: absolute;
    left: 14px;
    top: 50%;
    transform: translateY(-50%);
    font-size: 16px;
  }
  .container {
    padding: 16px;
    max-width: 1200px;
    margin: 0 auto;
  }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
    gap: 14px;
  }
  @media (min-width: 480px) {
    .grid { grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); }
  }
  @media (min-width: 768px) {
    .grid { grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 18px; }
  }
  .card {
    background: var(--card);
    border-radius: 16px;
    overflow: hidden;
    box-shadow: var(--shadow);
    cursor: pointer;
    transition: transform 0.2s, box-shadow 0.2s;
    display: flex;
    flex-direction: column;
  }
  .card:active { transform: scale(0.97); }
  .card:hover { transform: translateY(-4px); box-shadow: 0 8px 24px rgba(0,0,0,0.12); }
  .thumb-wrap {
    position: relative;
    aspect-ratio: 16/10;
    background: #eee;
    overflow: hidden;
  }
  .thumb-wrap img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }
  .play-badge {
    position: absolute;
    bottom: 8px;
    right: 8px;
    background: rgba(0,0,0,0.7);
    color: white;
    border-radius: 20px;
    padding: 4px 10px;
    font-size: 12px;
    font-weight: 600;
    display: flex;
    align-items: center;
    gap: 4px;
  }
  .play-badge::before {
    content: "▶";
    font-size: 10px;
  }
  .card-info {
    padding: 12px 12px 14px;
    flex: 1;
    display: flex;
    flex-direction: column;
  }
  .card-info h3 {
    font-size: 14px;
    font-weight: 650;
    line-height: 1.3;
    margin-bottom: 6px;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }
  .meta {
    font-size: 12px;
    color: var(--muted);
    margin-top: auto;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .tag {
    background: #e8f1ff;
    color: var(--primary);
    padding: 2px 8px;
    border-radius: 8px;
    font-size: 11px;
    font-weight: 600;
  }

  /* Detail view */
  .detail-view {
    display: none;
    position: fixed;
    inset: 0;
    background: #f5f7fa;
    z-index: 1000;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
  }
  .detail-view.active { display: block; }
  .detail-header {
    background: #0066cc;
    color: white;
    padding: 12px 16px;
    display: flex;
    align-items: center;
    gap: 12px;
    position: sticky;
    top: 0;
    z-index: 10;
  }
  .detail-header button {
    background: none;
    border: none;
    color: white;
    font-size: 24px;
    cursor: pointer;
    padding: 4px;
  }
  .detail-header h2 {
    font-size: 16px;
    font-weight: 650;
  }
  .video-wrap {
    background: #000;
    width: 100%;
  }
  .video-wrap iframe {
    width: 100%;
    aspect-ratio: 16/9;
    border: none;
    display: block;
  }
  .notes {
    background: white;
    margin: 12px;
    border-radius: 16px;
    padding: 18px 16px 24px;
    box-shadow: var(--shadow);
  }
  .notes h3 {
    font-size: 17px;
    margin-bottom: 12px;
    color: #0066cc;
  }
  .notes ol {
    padding-left: 20px;
  }
  .filters {
    display: flex;
    gap: 8px;
    margin-top: 12px;
    flex-wrap: wrap;
  }
  .filter-btn {
    background: rgba(255,255,255,0.2);
    color: white;
    border: 1px solid rgba(255,255,255,0.3);
    padding: 6px 14px;
    border-radius: 20px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
  }
  .filter-btn.active {
    background: white;
    color: #0066cc;
  }
  .card-btn {
    margin-top: 8px;
    background: #0066cc;
    color: white;
    border: none;
    border-radius: 10px;
    padding: 8px 12px;
    font-size: 13px;
    font-weight: 600;
    width: 100%;

  }
  .notes li {
    margin-bottom: 14px;
    line-height: 1.6;
    font-size: 15.5px;
    padding-left: 4px;
  }
  .notes li::marker {
    font-weight: 700;

  }
  .no-result {
    text-align: center;
    padding: 60px 20px;
    color: var(--muted);
    grid-column: 1 / -1;
  }
  footer {
    text-align: center;
    padding: 20px;
    font-size: 12px;
    color: #999;
  }
</style>
</head>

function getThumb(id) {
  return `https://drive.google.com/thumbnail?id=${id}&sz=w600`;
}
function getPreview(id) {
  return `https://drive.google.com/file/d/${id}/preview`;
}

function render(list = videos) {
  const grid = document.getElementById("grid");
  if (list.length === 0) {
    grid.innerHTML = `<div class="no-result">Không tìm thấy công tơ nào</div>`;
    return;
  }
  grid.innerHTML = list.map(v => `
    <div class="card" onclick="openDetail('${v.id}')">
      <div class="thumb-wrap">
        <img src="${getThumb(v.id)}" alt="${v.name}" loading="lazy" onerror="this.src='https://via.placeholder.com/400x250/eeeeee/999999?text=Công+tơ'">
        <div class="play-badge">Xem</div>
      </div>
      <div class="card-info">
        <h3>${v.name}</h3>
        <div class="meta">
          <span class="tag">${v.type}</span>
          <span>${v.size}</span>
        </div>
        <button class="card-btn" onclick="event.stopPropagation(); openDetail('${v.id}')">▶ Xem hướng dẫn</button>
      </div>
    </div>
  `).join("");
}

function openDetail(id) {
  const video = videos.find(v => v.id === id);
  if (!video) return;

  document.getElementById("detailTitle").textContent = video.name;
  document.getElementById("videoFrame").src = getPreview(id);

  const notesHtml = `
    <h3>📋 Hướng dẫn chi tiết cài đặt công tơ</h3>
    <ol>
      ${video.notes.map(step => `<li>${step}</li>`).join("")}
    </ol>
  `;
  document.getElementById("notesContent").innerHTML = notesHtml;

  document.getElementById("detailView").classList.add("active");
  document.body.style.overflow = "hidden";
}

function closeDetail() {
  document.getElementById("detailView").classList.remove("active");
  document.getElementById("videoFrame").src = "";
  document.body.style.overflow = "";
}

let currentFilter = "all";

document.querySelectorAll(".filter-btn").forEach(btn => {
  btn.addEventListener("click", () => {
    document.querySelectorAll(".filter-btn").forEach(b => b.classList.remove("active"));
    btn.classList.add("active");
    currentFilter = btn.dataset.type;
    applyFilter();
  });
});

function applyFilter() {
  const q = document.getElementById("search").value.toLowerCase().trim();
  const filtered = videos.filter(v => {
    const matchType = currentFilter === "all" || v.type === currentFilter;
    const matchSearch = !q || v.name.toLowerCase().includes(q) || v.full.toLowerCase().includes(q);
    return matchType && matchSearch;
  });
  render(filtered);
}

document.getElementById("search").addEventListener("input", applyFilter);

render();
